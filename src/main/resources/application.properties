# Server Configuration
server.port=${PORT:8080}

# Database Configuration
# Defaults to in-memory H2 (zero setup), or connects to MySQL if DB_URL is supplied in environment
spring.datasource.url=${DB_URL:jdbc:h2:mem:library_management;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Enable H2 web console (optional, accessible at /h2-console)
spring.h2.console.enabled=true

# CORS allowed origins (defaults to * so frontend can connect from any domain)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
